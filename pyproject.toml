[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-eval-workbench"
version = "0.1.0"
description = "LLM 能力评估工作台：多维度 benchmark 评分系统 + 角色画像权重矩阵 + 本地模型部署监控"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "tabulate>=0.9",
    "pyarrow>=25.0.0",
]
license = {text = "MIT"}
authors = [
    {name = "Zjrua"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
llm-eval = "scripts.evaluate:main"

[tool.setuptools]
package-dir = {"" = "src"}

# ── uv 依赖组 (PEP 735) ──────────────────────────────────────
# 用 `uv sync` 安装核心依赖; 加 `--group <name>` 装额外组.
#   uv sync --group learning    # 跑权重学习
#   uv sync --group dev         # 跑测试
#   uv sync --group fastapi     # 跑 local-deploy 监控
# 等价于旧的 `pip install -e ".[learning]"`, 但用 uv.lock 锁定可复现.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
# 权重学习子模块 src/llm_eval/learning/ 的依赖
# 不装此组时核心评分功能 (scoring/profiles/models) 仍可用
learning = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "jax>=0.4",
    "numpyro>=0.14",
    "huggingface_hub>=0.20",
]
fastapi = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

